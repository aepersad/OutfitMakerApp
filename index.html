<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build My Outfit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 40px 20px;">
    <h1 style="text-align:center; margin-bottom:32px;">Build My Outfit</h1>
    <section class="auth-card" style="width:100%;">
      <h2>Login</h2>
      <label for="usernameInput">Username</label>
      <input id="usernameInput" type="text" placeholder="Enter your username" />
      <label for="passwordInput">Password</label>
      <input id="passwordInput" type="password" placeholder="Enter your password" />
      <div class="button-row">
        <button id="loginBtn" class="primary">Login</button>
        <button id="guestBtn" class="secondary">Continue as Guest</button>
      </div>
      <p id="authMsg" class="message"></p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
