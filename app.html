<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build My Outfit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <div class="topbar">
      <div>
        <h1>Build My Outfit</h1>
        <p id="profileLabel" class="hero-subtitle" style="text-align:left; margin-bottom:0;"></p>
      </div>
      <button id="logoutBtn" class="logout-btn">Log out</button>
    </div>

    <div class="grid-layout">

      <!-- ── LEFT: Add Item ── -->
      <div class="left-column">
        <section class="section-card">
          <h2>Add Item</h2>
          <div class="counter"><span id="closetCount">0/10</span></div>

          <div class="upload-box">
            <label for="fileInput">Upload Image</label>
            <input id="fileInput" type="file" accept="image/*" />
            <p id="fileName" class="muted">No file chosen</p>
            <div class="preview-box">
              <img id="imgPreview" style="display:none;" alt="Preview" />
              <div id="previewPlaceholder" class="preview-placeholder">Preview</div>
            </div>
          </div>

          <div class="divider"></div>

          <label for="categorySelect">Category</label>
          <select id="categorySelect">
            <option value="">Select</option>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="dress">Dress</option>
            <option value="shoes">Shoes</option>
            <option value="outerwear">Outerwear</option>
          </select>

          <div id="topTypeGroup" class="hidden">
            <label for="topTypeSelect">Top type</label>
            <select id="topTypeSelect">
              <option value="">Select</option>
              <option value="shirt">Shirt</option>
              <option value="cardigan">Cardigan</option>
              <option value="sweater">Sweater</option>
              <option value="jacket">Jacket</option>
            </select>
          </div>

          <div id="bottomTypeGroup" class="hidden">
            <label for="bottomTypeSelect">Bottom type</label>
            <select id="bottomTypeSelect">
              <option value="">Select</option>
              <option value="jeans">Jeans</option>
              <option value="leggings">Leggings</option>
              <option value="sweatpants">Sweatpants</option>
              <option value="trousers">Trousers</option>
              <option value="shorts">Shorts</option>
              <option value="skirt">Skirt</option>
            </select>
          </div>

          <div id="sleeveGroup" class="hidden">
            <label for="sleeveSelect">Sleeve length</label>
            <select id="sleeveSelect">
              <option value="">Select</option>
              <option value="sleeveless">Sleeveless</option>
              <option value="short">Short</option>
              <option value="long">Long</option>
            </select>
          </div>

          <div id="dressLengthGroup" class="hidden">
            <label for="dressLengthSelect">Dress length</label>
            <select id="dressLengthSelect">
              <option value="">Select</option>
              <option value="mini">Mini</option>
              <option value="midi">Midi</option>
              <option value="maxi">Maxi</option>
            </select>
          </div>

          <div id="shoeTypeGroup" class="hidden">
            <label for="shoeTypeSelect">Shoe type</label>
            <select id="shoeTypeSelect">
              <option value="">Select</option>
              <option value="sneakers">Sneakers</option>
              <option value="heels">Heels</option>
              <option value="boots">Boots</option>
              <option value="flats">Flats</option>
              <option value="sandals">Sandals</option>
              <option value="loafers">Loafers</option>
            </select>
          </div>

          <div id="outerwearTypeGroup" class="hidden">
            <label for="outerwearTypeSelect">Outerwear type</label>
            <select id="outerwearTypeSelect">
              <option value="">Select</option>
              <option value="coat">Coat</option>
              <option value="blazer">Blazer</option>
              <option value="trench">Trench</option>
              <option value="puffer">Puffer</option>
              <option value="denim_jacket">Denim Jacket</option>
              <option value="leather_jacket">Leather Jacket</option>
            </select>
          </div>

          <label for="colorSelect">Color</label>
          <select id="colorSelect">
            <option value="">Select</option>
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="gray">Gray</option>
            <option value="blue">Blue</option>
            <option value="beige">Beige</option>
            <option value="cream">Cream</option>
            <option value="brown">Brown</option>
            <option value="denim_blue">Denim Blue</option>
            <option value="red">Red</option>
            <option value="pink">Pink</option>
            <option value="green">Green</option>
            <option value="purple">Purple</option>
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
          </select>

          <label for="occasionSelect">Occasion</label>
          <select id="occasionSelect">
            <option value="">Select</option>
            <option value="Casual">Casual</option>
            <option value="Work">Work</option>
            <option value="Formal">Formal</option>
            <option value="Date Night">Date Night</option>
            <option value="Sport">Sport</option>
            <option value="Weekend">Weekend</option>
          </select>

          <div class="button-row">
            <button id="saveItemBtn" class="primary">Save Item</button>
            <button id="clearClosetBtn" class="secondary">Clear Closet</button>
          </div>

          <p id="uploadMsg" class="message"></p>
        </section>
      </div>

      <!-- ── RIGHT: Closet + Matches + Calendar + Profile ── -->
      <div class="right-column">

        <section class="section-card">
          <h2>My Closet</h2>
          <div class="closet-toolbar">
            <input type="text" id="closetSearch" placeholder="Search items…" />
            <select id="closetFilterCategory">
              <option value="">All categories</option>
              <option value="top">Top</option>
              <option value="bottom">Bottom</option>
              <option value="dress">Dress</option>
              <option value="shoes">Shoes</option>
              <option value="outerwear">Outerwear</option>
            </select>
            <select id="closetFilterOccasion">
              <option value="">All occasions</option>
              <option value="Casual">Casual</option>
              <option value="Work">Work</option>
              <option value="Formal">Formal</option>
              <option value="Date Night">Date Night</option>
              <option value="Sport">Sport</option>
              <option value="Weekend">Weekend</option>
            </select>
          </div>
          <div id="closetGrid"></div>
        </section>

        <section class="section-card">
          <div class="outfit-section-header">
            <h2>Outfit Matches</h2>
            <button id="surpriseMeBtn" class="surprise-btn">✦ Surprise Me</button>
          </div>
          <p id="selectedLabel" class="muted">Select an item from your closet.</p>
          <div id="occasionFilterBar" class="filter-bar"></div>
          <p id="outfitMsg" class="message"></p>
          <div id="outfitsGrid"></div>
        </section>

        <section class="section-card">
          <h2>Outfit Calendar</h2>
          <p id="calendarMsg" class="muted" style="margin-bottom:14px;">Save outfits to plan your week.</p>
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>

        <section class="section-card">
          <h2>Style Profile</h2>
          <p id="styleProfileMsg" class="muted">Rate and wear outfits to build your profile.</p>
          <div id="styleProfileBars"></div>
        </section>

      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
