<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build My Outfit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <div class="topbar">
      <div>
        <h1>Build My Outfit</h1>
        <p id="profileLabel" class="hero-subtitle" style="text-align:left; margin-bottom:0;"></p>
      </div>
      <button id="logoutBtn" class="logout-btn">Log out</button>
    </div>

    <div class="grid-layout">

      <!-- ── LEFT: Add / Edit Item ── -->
      <div class="left-column">
        <section class="section-card" id="addItemCard">
          <h2 id="formTitle">Add Item</h2>
          <div class="counter"><span id="closetCount">0/25</span></div>

          <p class="form-section-label">Item Details</p>
          <div class="upload-box">
            <label for="fileInput">Upload Image</label>
            <input id="fileInput" type="file" accept="image/*" />
            <p id="fileName" class="muted">No file chosen</p>
            <div class="preview-box">
              <img id="imgPreview" style="display:none;" alt="Preview" />
              <div id="previewPlaceholder" class="preview-placeholder">Preview</div>
            </div>
          </div>

          <div class="divider"></div>

          <label for="categorySelect">Category</label>
          <select id="categorySelect">
            <option value="">Select</option>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="dress">Dress</option>
            <option value="shoes">Shoes</option>
            <option value="outerwear">Outerwear</option>
          </select>

          <div id="topTypeGroup" class="hidden">
            <label for="topTypeSelect">Top type</label>
            <select id="topTypeSelect">
              <option value="">Select</option>
              <option value="tank-top">Tank Top</option>
              <option value="t-shirt">T-Shirt</option>
              <option value="blouse">Blouse</option>
              <option value="button-up">Button-Up</option>
              <option value="sweater">Sweater</option>
            </select>
          </div>

          <div id="bottomTypeGroup" class="hidden">
            <label for="bottomTypeSelect">Bottom type</label>
            <select id="bottomTypeSelect">
              <option value="">Select</option>
              <option value="jeans">Jeans</option>
              <option value="leggings">Leggings</option>
              <option value="sweatpants">Sweatpants</option>
              <option value="trousers">Trousers</option>
              <option value="shorts">Shorts</option>
              <option value="skirt">Skirt</option>
            </select>
          </div>

          <div id="skirtLengthGroup" class="hidden">
            <label for="skirtLengthSelect">Skirt length</label>
            <select id="skirtLengthSelect">
              <option value="">Select</option>
              <option value="mini">Mini</option>
              <option value="midi">Midi</option>
              <option value="maxi">Maxi</option>
            </select>
          </div>

          <div id="sleeveGroup" class="hidden">
            <label for="sleeveSelect">Sleeve length</label>
            <select id="sleeveSelect">
              <option value="">Select</option>
              <option value="short">Short</option>
              <option value="long">Long</option>
            </select>
          </div>

          <div id="dressLengthGroup" class="hidden">
            <label for="dressLengthSelect">Dress length</label>
            <select id="dressLengthSelect">
              <option value="">Select</option>
              <option value="mini">Mini</option>
              <option value="midi">Midi</option>
              <option value="maxi">Maxi</option>
            </select>
          </div>

          <div id="shoeTypeGroup" class="hidden">
            <label for="shoeTypeSelect">Shoe type</label>
            <select id="shoeTypeSelect">
              <option value="">Select</option>
              <option value="sneakers">Sneakers</option>
              <option value="heels">Heels</option>
              <option value="boots">Boots</option>
              <option value="flats">Flats</option>
              <option value="sandals">Sandals</option>
              <option value="loafers">Loafers</option>
            </select>
          </div>

          <div id="outerwearTypeGroup" class="hidden">
            <label for="outerwearTypeSelect">Outerwear type</label>
            <select id="outerwearTypeSelect">
              <option value="">Select</option>
              <option value="cardigan">Cardigan</option>
              <option value="blazer">Blazer</option>
              <option value="denim_jacket">Denim Jacket</option>
              <option value="leather_jacket">Leather Jacket</option>
              <option value="coat">Coat</option>
              <option value="trench">Trench</option>
              <option value="puffer">Puffer</option>
            </select>
          </div>

          <div class="divider"></div>
          <p class="form-section-label">Color & Style</p>

          <label for="colorSelect">Primary Color</label>
          <select id="colorSelect">
            <option value="">Select</option>
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="gray">Gray</option>
            <option value="blue">Blue</option>
            <option value="beige">Beige</option>
            <option value="cream">Cream</option>
            <option value="brown">Brown</option>
            <option value="denim_blue">Denim Blue</option>
            <option value="red">Red</option>
            <option value="pink">Pink</option>
            <option value="green">Green</option>
            <option value="purple">Purple</option>
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
          </select>

          <label for="color2Select">Secondary Color <span style="font-weight:400; text-transform:none; letter-spacing:0; font-size:0.75rem; color:var(--muted);">(optional)</span></label>
          <select id="color2Select">
            <option value="">None</option>
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="gray">Gray</option>
            <option value="blue">Blue</option>
            <option value="beige">Beige</option>
            <option value="cream">Cream</option>
            <option value="brown">Brown</option>
            <option value="denim_blue">Denim Blue</option>
            <option value="red">Red</option>
            <option value="pink">Pink</option>
            <option value="green">Green</option>
            <option value="purple">Purple</option>
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
          </select>

          <label for="patternSelect">Pattern</label>
          <select id="patternSelect">
            <option value="solid">Solid</option>
            <option value="patterned">Patterned</option>
          </select>

          <label for="occasionSelect">Occasion <span style="font-weight:400; text-transform:none; letter-spacing:0; font-size:0.75rem; color:var(--muted);">(optional)</span></label>
          <select id="occasionSelect">
            <option value="">Select</option>
            <option value="Casual">Casual</option>
            <option value="Work">Work</option>
            <option value="Formal">Formal</option>
            <option value="Date Night">Date Night</option>
            <option value="Sport">Sport</option>
            <option value="Weekend">Weekend</option>
          </select>

          <div class="button-row">
            <button id="saveItemBtn" class="primary">Save Item</button>
            <button id="clearItemBtn" class="secondary">Clear</button>
            <button id="cancelEditBtn" class="secondary hidden">Cancel</button>
          </div>

          <p id="uploadMsg" class="message"></p>
        </section>
      </div>

      <!-- ── RIGHT: Tabbed sections ── -->
      <div class="right-column">
        <section class="section-card">

          <nav class="tab-bar" role="tablist">
            <button class="tab-btn active" data-panel="panel-closet"   role="tab" aria-selected="true">Closet</button>
            <button class="tab-btn"        data-panel="panel-matches"  role="tab" aria-selected="false">Matches</button>
            <button class="tab-btn"        data-panel="panel-saved"    role="tab" aria-selected="false">Saved Outfits</button>
            <button class="tab-btn"        data-panel="panel-calendar" role="tab" aria-selected="false">Calendar</button>
            <button class="tab-btn"        data-panel="panel-profile"  role="tab" aria-selected="false">Profile</button>
          </nav>

          <!-- Closet tab -->
          <div id="panel-closet" class="tab-panel" role="tabpanel">
            <div class="closet-layout">
              <div class="closet-filters">
                <label for="closetSearch">Search</label>
                <input type="text" id="closetSearch" placeholder="Search items…" />
                <label for="closetFilterCategory">Category</label>
                <select id="closetFilterCategory">
                  <option value="">All</option>
                  <option value="top">Top</option>
                  <option value="bottom">Bottom</option>
                  <option value="dress">Dress</option>
                  <option value="shoes">Shoes</option>
                  <option value="outerwear">Outerwear</option>
                </select>
                <label for="closetFilterOccasion">Occasion</label>
                <select id="closetFilterOccasion">
                  <option value="">All</option>
                  <option value="Casual">Casual</option>
                  <option value="Work">Work</option>
                  <option value="Formal">Formal</option>
                  <option value="Date Night">Date Night</option>
                  <option value="Sport">Sport</option>
                  <option value="Weekend">Weekend</option>
                </select>
              </div>
              <div id="closetGrid"></div>
            </div>
          </div>

          <!-- Matches tab -->
          <div id="panel-matches" class="tab-panel hidden" role="tabpanel">
            <div class="outfit-section-header">
              <p id="selectedLabel" class="muted" style="margin:0;">Select an item from your closet.</p>
              <button id="surpriseMeBtn" class="surprise-btn">✦ Surprise Me</button>
            </div>
            <div id="occasionFilterBar" class="filter-bar"></div>
            <p id="outfitMsg" class="message"></p>
            <div id="outfitsGrid"></div>
          </div>

          <!-- Saved tab -->
          <div id="panel-saved" class="tab-panel hidden" role="tabpanel">
            <p id="savedMsg" class="muted" style="margin-bottom:14px;">Save outfits from the Matches tab to see them here.</p>
            <div id="savedGrid"></div>
          </div>

          <!-- Calendar tab -->
          <div id="panel-calendar" class="tab-panel hidden" role="tabpanel">
            <p id="calendarMsg" class="muted" style="margin-bottom:16px;">Save outfits from the Matches tab to plan your week.</p>
            <div id="calendarGrid" class="calendar-grid"></div>
          </div>

          <!-- Profile tab -->
          <div id="panel-profile" class="tab-panel hidden" role="tabpanel">
            <p id="styleProfileMsg" class="muted">Rate and wear outfits to build your profile.</p>
            <div id="styleProfileBars"></div>
          </div>

        </section>
      </div>

    </div>
  </main>

  <script src="app.js?v=20"></script>
</body>
</html>
